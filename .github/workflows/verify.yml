name: Apply Supabase staging migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-migration:
    if: github.ref == 'refs/heads/feature/clinpharm-audit-report'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/clinpharm-audit-report

      - name: Validate target project
        run: |
          set -euo pipefail

          REQUIRED_PROJECT_REF="ioekwknwhpeocvrxnwni"
          CONFIGURED_PROJECT_REF="ioekwknwhpeocvrxnwni"

          if [ "$CONFIGURED_PROJECT_REF" != "$REQUIRED_PROJECT_REF" ]; then
            echo "ERROR: Project reference mismatch."
            exit 1
          fi

          echo "Target project validated: $REQUIRED_PROJECT_REF"

      - name: Validate branch
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/feature/clinpharm-audit-report" ]; then
            echo "ERROR: Wrong branch."
            echo "Current: $GITHUB_REF"
            exit 1
          fi

          echo "Branch validation passed."

      - name: Check migration file
        run: |
          set -euo pipefail

          SQL_FILE="supabase/migrations/0001_initial_schema.sql"

          if [ ! -f "$SQL_FILE" ]; then
            echo "ERROR: Migration file not found:"
            echo "$SQL_FILE"
            exit 1
          fi

          echo "Migration file found."

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

          psql --version

      - name: Safety scan
        run: |
          set -euo pipefail

          SQL_FILE="supabase/migrations/0001_initial_schema.sql"

          if grep -Eiq \
            "DROP[[:space:]]+DATABASE|DROP[[:space:]]+SCHEMA|TRUNCATE[[:space:]]+TABLE|RESET[[:space:]]+DATABASE" \
            "$SQL_FILE"
          then
            echo "ERROR: Destructive SQL detected."
            exit 1
          fi

          echo "Safety scan passed."

      - name: Verify database secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "ERROR: SUPABASE_DB_URL secret is not configured."
            echo "Add it under:"
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "SUPABASE_DB_URL is configured."

      - name: Verify staging database host
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys
          import urllib.parse

          url = os.environ.get("SUPABASE_DB_URL", "")

          if not url:
              print("ERROR: Database URL is empty.")
              sys.exit(1)

          try:
              parsed = urllib.parse.urlparse(url)
              host = parsed.hostname or ""
          except Exception:
              print("ERROR: Database URL is malformed.")
              sys.exit(1)

          required = "ioekwknwhpeocvrxnwni"

          if required not in host:
              print("ERROR: Database host does not match the staging project.")
              sys.exit(1)

          print("Staging database host verified.")
          PY

      - name: Test database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          echo "Testing Supabase staging database connection..."

          if ! timeout 15s \
            psql "$SUPABASE_DB_URL" \
            -tA \
            -c "SELECT 1;" \
            >/dev/null 2>&1
          then
            echo "ERROR: Could not connect to staging database."
            exit 1
          fi

          echo "Database connection successful."

      - name: Apply migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          SQL_FILE="supabase/migrations/0001_initial_schema.sql"

          echo "Applying migration to Supabase STAGING..."
          echo "Project ref: ioekwknwhpeocvrxnwni"
          echo "Migration: $SQL_FILE"

          psql \
            "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --file="$SQL_FILE"

          echo "Migration completed successfully."

      - name: Final confirmation
        run: |
          echo "=========================================="
          echo "SUPABASE STAGING MIGRATION COMPLETED"
          echo "=========================================="
          echo "Project: ioekwknwhpeocvrxnwni"
          echo "Branch: feature/clinpharm-audit-report"
          echo "Migration: 0001_initial_schema.sql"
          echo "=========================================="
