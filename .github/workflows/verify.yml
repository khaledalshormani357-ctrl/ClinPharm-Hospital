name: Verify ClinPharm Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/clinpharm-audit-report

      - name: Verify branch
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/feature/clinpharm-audit-report" ]; then
            echo "ERROR: Wrong branch."
            echo "Current: $GITHUB_REF"
            exit 1
          fi

          echo "Branch check passed."

      - name: Check migration file
        run: |
          set -euo pipefail

          test -f supabase/migrations/0001_initial_schema.sql

          echo "Migration file found."

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

          psql --version

      - name: Check database secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "ERROR: SUPABASE_DB_URL secret is missing."
            exit 1
          fi

          echo "SUPABASE_DB_URL is configured."

      - name: Test database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          echo "Testing database connection..."

          timeout 15s psql \
            "$SUPABASE_DB_URL" \
            -tA \
            -c "SELECT 1;" \
            >/dev/null

          echo "Database connection successful."

      - name: Safety check
        run: |
          set -euo pipefail

          SQL_FILE="supabase/migrations/0001_initial_schema.sql"

          if grep -Eiq \
            "DROP[[:space:]]+DATABASE|DROP[[:space:]]+SCHEMA|TRUNCATE[[:space:]]+TABLE|RESET[[:space:]]+DATABASE" \
            "$SQL_FILE"; then

            echo "ERROR: Destructive SQL detected."
            exit 1
          fi

          echo "Safety check passed."

      - name: Verify staging project
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          REQUIRED_PROJECT_REF="ioekwknwhpeocvrxnwni"

          HOST=$(python3 -c '
          import os
          import urllib.parse

          url = os.environ["SUPABASE_DB_URL"]
          parsed = urllib.parse.urlparse(url)
          print(parsed.hostname or "")
          ')

          if [[ "$HOST" != *"$REQUIRED_PROJECT_REF"* ]]; then
            echo "ERROR: Database host does not match staging project."
            exit 1
          fi

          echo "Staging project verified."

      - name: Verify database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          psql \
            "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            -c "SELECT current_database();"

          echo "Database verification completed."

      - name: Final result
        run: |
          echo "========================================"
          echo "ClinPharm staging verification PASSED"
          echo "Project: ioekwknwhpeocvrxnwni"
          echo "Branch: feature/clinpharm-audit-report"
          echo "========================================"
